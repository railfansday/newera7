name: Scrape & Export Berita

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser requests beautifulsoup4 lxml

      # ===== JALANKAN FILE GABUNGAN =====
      - name: Jalankan Scraper & Export
        run: python importexport.py

      # ===== COMMIT & PUSH =====
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ambil semua file HTML, xml, txt, dan database di folder utama
          git add *.html *.xml *.txt database_hasil5/ || true
          
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          
          git commit -m "Update otomatis: Scrape & Export HTML [skip ci]"
          git pull --rebase origin main || true
          git push
